
<style>
.pf-wrap {
  --pf-bg: #0b0b0c;
  --pf-bg-soft: #141416;
  --pf-ink: #f4f1ea;
  --pf-muted: #a39e93;
  --pf-accent: #c4a574;
  --pf-line: rgba(244, 241, 234, 0.14);
  --pf-ease: cubic-bezier(0.22, 1, 0.36, 1);

  /* الخطوط: h = العناوين، s = العناوين الجانبية، t = النصوص */

  --pf-s: "Lucida Calligraphy", "Lucida Handwriting", "Merienda", cursive;
  --pf-t: "Script MT Bold", "Script MT", "Dancing Script", cursive;

  position: relative;
  width: 100%;
  background: var(--pf-bg);
  color: var(--pf-ink);
  font-family: var(--pf-t);
  font-size: 1.2rem;
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: 0;
  overflow-x: hidden;
}

.pf-wrap[lang="ar"] { --pf-h: "Lobster 1.4", "Lobster", "Aref Ruqaa", serif; --pf-s: "Lucida Calligraphy", "Merienda", "Amiri", serif; --pf-t: "Script MT Bold", "Dancing Script", "Noto Naskh Arabic", serif; }
.pf-wrap[lang="ru"] { --pf-s: "Lucida Calligraphy", "Merienda", "Marck Script", cursive; --pf-t: "Script MT Bold", "Dancing Script", "Caveat", cursive; }
.pf-wrap[lang="zh"] { --pf-h: "Lobster 1.4", "Lobster", "Ma Shan Zheng", cursive; --pf-s: "Lucida Calligraphy", "Merienda", "ZCOOL XiaoWei", serif; --pf-t: "Script MT Bold", "Dancing Script", "Noto Serif SC", serif; }
.pf-wrap[lang="ja"] { --pf-h: "Lobster 1.4", "Lobster", "Yuji Syuku", serif; --pf-s: "Lucida Calligraphy", "Merienda", "Shippori Mincho", serif; --pf-t: "Script MT Bold", "Dancing Script", "Noto Serif JP", serif; }
.pf-wrap[lang="ko"] { --pf-h: "Lobster 1.4", "Lobster", "Nanum Brush Script", cursive; --pf-s: "Lucida Calligraphy", "Merienda", "Nanum Myeongjo", serif; --pf-t: "Script MT Bold", "Dancing Script", "Noto Serif KR", serif; }
.pf-wrap[lang="el"] { --pf-h: "Lobster 1.4", "Lobster", "GFS Neohellenic", sans-serif; --pf-s: "Lucida Calligraphy", "Merienda", "GFS Neohellenic", sans-serif; --pf-t: "Script MT Bold", "Dancing Script", "Noto Serif Greek", serif; }

.pf-wrap *, .pf-wrap *::before, .pf-wrap *::after { box-sizing: border-box; }

/* ---------- خطوط الأدوار ---------- */

.pf-kicker, .pf-tabs button, .pf-btn, .pf-cta, .pf-langs button, .pf-door__index, .pf-door__meta, .pf-cv-cols h2,
.pf-cv-row h3, .pf-service h3, .pf-story h3, .pf-facts dt, .pf-card__year, .pf-skill-head { font-family: var(--pf-s); }

.pf-kicker { font-size: 1rem; letter-spacing: .04em; color: var(--pf-accent); margin-bottom: 1rem; }
.pf-display { font-size: clamp(2.8rem, 8vw, 6.5rem); line-height: 1.05; }
.pf-title { font-size: clamp(1.9rem, 4vw, 3.2rem); line-height: 1.2; }
.pf-lede, .pf-hero__bio { max-width: 38rem; color: var(--pf-muted); font-size: 1.25rem; }
.pf-link { display: inline-block; margin-top: 1.25rem; border-bottom: 1px solid var(--pf-accent); padding-bottom: .15rem; transition: color .3s; }

.pf-hero::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .6;

.pf-hero__copy { position: relative; z-index: 2; padding: 8vw; }

.pf-langs { position: absolute; z-index: 3; top: 1.4rem; inset-inline-end: 4vw; inset-inline-start: 4vw; pointer-events: none; display: flex; flex-wrap: wrap; gap: .3rem .9rem; justify-content: flex-end; }
.pf-lang-btn { pointer-events: auto; display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--pf-line); border-radius: 999px;
  padding: .32rem 1rem; font-family: var(--pf-s); font-size: .85rem; color: var(--pf-ink); background: rgba(11,11,12,.55); backdrop-filter: blur(4px);
  transition: border-color .3s, color .3s; }
.pf-lang-btn:hover, .pf-lang-btn[aria-expanded="true"] { border-color: var(--pf-accent); color: var(--pf-accent); }
.pf-lang-btn i { font-style: normal; font-size: .7rem; transition: transform .3s var(--pf-ease); }

  border: 1px solid var(--pf-line); border-radius: .7rem; padding: .35rem; z-index: 20; box-shadow: 0 14px 44px rgba(0,0,0,.55);
  animation: pf-rise .35s var(--pf-ease); }
.pf-lang-menu[hidden] { display: none; }
.pf-lang-menu button { display: block; width: 100%; text-align: start; padding: .5rem .85rem; border-radius: .45rem; font-size: .92rem; color: var(--pf-muted); transition: color .25s, background .25s; }
.pf-lang-menu button:hover { color: var(--pf-ink); background: rgba(196,165,116,.09); }
.pf-lang-menu button.is-active { color: var(--pf-accent); }

/* ---------- الأبواب ---------- */
.pf-doors { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--pf-line); }
.pf-door { min-height: 34vh; padding: 5vw 4vw; display: flex; flex-direction: column; justify-content: space-between;
  border-inline-end: 1px solid var(--pf-line); }
.pf-door:last-child { border-inline-end: 0; }
.pf-door:hover, .pf-door:focus-visible { background: var(--pf-bg-soft); box-shadow: inset 0 0 0 1px var(--pf-accent); }
.pf-door__title { font-size: clamp(2rem, 4.6vw, 3.8rem); line-height: 1.15; }
.pf-door__index, .pf-door__meta { color: var(--pf-accent); font-size: .95rem; display: block; }
.pf-door { position: relative; overflow: hidden; isolation: isolate; }
.pf-door > span { position: relative; z-index: 1; }
.pf-door__holo { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s var(--pf-ease); pointer-events: none; }
.pf-door:hover .pf-door__holo, .pf-door:focus-visible .pf-door__holo { opacity: 1; }

/* ---------- الأقسام ---------- */
.pf-section { position: relative; isolation: isolate; overflow: hidden; padding: 8vw; border-top: 1px solid var(--pf-line); }
.pf-section > *:not(.pf-holo) { position: relative; z-index: 1; }
.pf-section::before { content: ""; position: absolute; z-index: 2; top: -1px; inset-inline: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--pf-accent), transparent); transform: scaleX(0); transition: transform 1.6s var(--pf-ease); }
.pf-section.is-in::before { transform: scaleX(1); }
.pf-section > .pf-title { margin-bottom: 2rem; }

/* ---------- الحركات (reveal) ---------- */
.pf-reveal { opacity: 0; transform: translateY(30px); transition: opacity .9s var(--pf-ease), transform .9s var(--pf-ease); transition-delay: calc(var(--d, 0) * 90ms); }
.pf-reveal.is-in { opacity: 1; transform: none; }
.pf-door.pf-reveal { transition: opacity .9s var(--pf-ease), transform .9s var(--pf-ease), background .6s var(--pf-ease), color .6s var(--pf-ease);
  transition-delay: calc(var(--d, 0) * 90ms), calc(var(--d, 0) * 90ms), 0s, 0s; }
.pf-words { line-height: 1.55; }
.pf-words .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding: .3em .06em .42em .04em; margin: -.3em 0 -.42em; }
.pf-words .w > span { display: inline-block; transform: translateY(115%); transition: transform 1.1s var(--pf-ease); transition-delay: calc(var(--i) * 80ms); }
.pf-words.is-in .w > span { transform: none; }

/* ---------- Skeleton ---------- */
.pf-skel { position: relative; overflow: hidden; background: var(--pf-bg-soft); }
.pf-skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(196,165,116,.14), transparent); animation: pf-shimmer 1.5s infinite; }
.pf-wrap[dir="rtl"] .pf-skel::after { animation-direction: reverse; }
.pf-line { height: 1rem; border-radius: 4px; margin: .7rem 0; }

/* ---------- المشاريع ---------- */
.pf-tabs { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 2.2rem; }
.pf-tabs button { border: 1px solid var(--pf-line); padding: .35rem 1.1rem; border-radius: 999px; font-size: .95rem; transition: all .3s; }
.pf-tabs button:hover { border-color: var(--pf-accent); }
.pf-tabs button.is-active { background: var(--pf-accent); border-color: var(--pf-accent); color: var(--pf-bg); }
.pf-tabs button { position: relative; overflow: hidden; isolation: isolate; }
.pf-tabs button > span { position: relative; z-index: 1; }
.pf-tab__holo { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .5s var(--pf-ease); pointer-events: none; }
.pf-tabs button:hover .pf-tab__holo, .pf-tabs button:focus-visible .pf-tab__holo, .pf-tabs button.is-active .pf-tab__holo { opacity: 1; }
.pf-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.4rem 1.5rem; }
.pf-card { display: block; width: 100%; }
.pf-card__stage { position: relative; aspect-ratio: 16 / 11; overflow: hidden; background: var(--pf-bg-soft); clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%); }
.pf-card__slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) saturate(.75);
  clip-path: inset(100% 0 0 0); mix-blend-mode: luminosity; transition: clip-path .3s var(--pf-ease); }

.pf-card__slides img.is-base.is-loaded { opacity: 1; }
.pf-card.is-sliding .pf-card__slides img.is-base { opacity: 0; }
.pf-card__slides img.is-slide { clip-path: inset(0); mix-blend-mode: normal; opacity: 0; transition: opacity .45s var(--pf-ease); }
.pf-card__slides img.is-slide.is-on { opacity: 1; }
.pf-card__year { position: absolute; inset-inline-end: 1rem; bottom: 1rem; z-index: 2; font-size: .9rem; }
.pf-card__meta h3 { font-size: 1.8rem; margin: .9rem 0 .2rem; line-height: 1.25; }
.pf-card__meta p { color: var(--pf-muted); }
.pf-empty { grid-column: 1 / -1; color: var(--pf-muted); }

/* ---------- السيرة ---------- */
.pf-cv-row { position: relative; display: grid; grid-template-columns: 9rem 1fr; gap: 1.5rem; padding: 1.4rem 0; border-bottom: 1px solid var(--pf-line); transition: padding .5s var(--pf-ease); }
.pf-cv-row::after { content: ""; position: absolute; bottom: -1px; inset-inline: 0; height: 1px; background: var(--pf-accent); transform: scaleX(0); transform-origin: left; transition: transform .9s var(--pf-ease); }
.pf-wrap[dir="rtl"] .pf-cv-row::after { transform-origin: right; }
.pf-cv-row:hover { padding-inline-start: 1rem; }
.pf-cv-row:hover::after { transform: scaleX(1); }
.pf-cv-row time { color: var(--pf-accent); font-family: var(--pf-s); font-size: .95rem; }
.pf-cv-row h3 { font-size: 1.3rem; }
.pf-cv-row p { color: var(--pf-muted); }
.pf-cv-cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4rem; }
.pf-cv-cols h2 { font-size: 1.8rem; margin-bottom: 1rem; font-weight: 400; }
.pf-skill-list { max-width: 36rem; }
.pf-skill-list li { margin-bottom: 1.2rem; }
.pf-skill-head { display: flex; justify-content: space-between; font-size: 1.05rem; }
.pf-skill-head em { color: var(--pf-accent); }
.pf-bar { position: relative; display: block; height: 2px; margin-top: .5rem; background: var(--pf-line); }
.pf-skill-zone { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; margin-top: 1rem; }
.pf-spider { max-width: 30rem; margin-inline: auto; width: 100%; }
.pf-spider svg { display: block; width: 100%; height: auto; overflow: visible; }
.pf-spider-web { fill: none; stroke: rgba(244,241,234,.13); stroke-width: 1; }
.pf-spider-axis { stroke: rgba(244,241,234,.09); stroke-width: 1; }
.pf-spider-data { transform-origin: 160px 160px; transform: scale(0); transition: transform 1.5s var(--pf-ease) .3s; }
.is-in .pf-spider-data { transform: scale(1); }
.pf-spider-shape { fill: rgba(196,165,116,.22); stroke: var(--pf-accent); stroke-width: 1.5; filter: drop-shadow(0 0 8px rgba(196,165,116,.45)); }
.pf-spider-dot { fill: var(--pf-accent); }
.pf-spider-label { fill: var(--pf-muted); font-family: var(--pf-s); font-size: 10.5px; }
.pf-spider-val { fill: var(--pf-accent); font-family: var(--pf-s); font-size: 9px; }
@media (max-width: 900px) { .pf-skill-zone { grid-template-columns: 1fr; } }
.pf-bar::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--level); background: var(--pf-accent);
  box-shadow: 0 0 10px rgba(196,165,116,.7); transform: scaleX(0); transform-origin: left; transition: transform 1.6s var(--pf-ease) .25s; }
.pf-wrap[dir="rtl"] .pf-bar::after { transform-origin: right; }
.is-in .pf-bar::after { transform: scaleX(1); }
.pf-pills { display: flex; flex-wrap: wrap; gap: .7rem; }
.pf-pills li { border: 1px solid var(--pf-line); padding: .3rem 1rem; border-radius: 999px; animation: pf-float 6s ease-in-out infinite; animation-delay: calc(var(--d, 0) * -1.3s); }
.pf-pills span { color: var(--pf-muted); font-size: .95rem; }

/* ---------- الخدمات ---------- */
.pf-shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.pf-shop-grid > .pf-reveal { display: block; }
.pf-service { position: relative; overflow: hidden; height: 100%; padding: 1.7rem; display: flex; flex-direction: column; gap: .8rem;
  border: 1px solid var(--pf-line); background: rgba(20,20,22,.62); backdrop-filter: blur(3px);
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .35s var(--pf-ease), color .5s var(--pf-ease), border-color .4s; }
.pf-service::before { content: ""; position: absolute; inset: 0; z-index: 0; background: var(--pf-accent); clip-path: inset(100% 0 0 0); transition: clip-path .65s var(--pf-ease); }
.pf-service::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(260px circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.3), transparent 60%); }
.pf-service > * { position: relative; z-index: 1; }
.pf-service:hover { border-color: var(--pf-accent); color: var(--pf-bg); }
.pf-service:hover::before { clip-path: inset(0); }
.pf-service:hover::after { opacity: 1; }
.pf-service h3 { font-size: 1.35rem; line-height: 1.4; }
.pf-service p { color: var(--pf-muted); flex: 1; transition: color .5s; }
.pf-service:hover p, .pf-service:hover .pf-price { color: var(--pf-bg); }
.pf-price { font-size: 1.7rem; color: var(--pf-accent); transition: color .5s; }
.pf-btn { display: inline-block; text-align: center; border: 1px solid var(--pf-accent); padding: .5rem 1rem; transition: all .3s; }
.pf-btn:hover { background: var(--pf-accent); color: var(--pf-bg); }
.pf-service:hover .pf-btn { border-color: var(--pf-bg); }
.pf-service:hover .pf-btn:hover { background: var(--pf-bg); color: var(--pf-accent); }

/* ---------- تواصل ---------- */
.pf-contact { text-align: center; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pf-contact .pf-title { font-size: clamp(2.4rem, 6vw, 5rem); margin-bottom: 1rem; }
.pf-contact .pf-lede { margin: 0 auto; }
.pf-cta { position: relative; display: inline-block; margin-top: 2rem; padding: .9rem 2.2rem; border: 1px solid var(--pf-accent); font-size: 1.15rem; transition: color .5s, background .5s, transform .3s var(--pf-ease); }
.pf-cta::before { content: ""; position: absolute; inset: -1px; border: 1px solid var(--pf-accent); pointer-events: none; animation: pf-ping 2.6s var(--pf-ease) infinite; }
.pf-cta:hover { background: var(--pf-accent); color: var(--pf-bg); }

/* ---------- النافذة ---------- */
.pf-modal { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.84); overflow-y: auto; padding: 4vw; animation: pf-fade .4s; }
.pf-modal[hidden] { display: none; }
.pf-modal__box { position: relative; max-width: 68rem; margin: 0 auto; background: var(--pf-bg); border: 1px solid var(--pf-line); padding: 3rem; animation: pf-rise .7s var(--pf-ease); }
.pf-modal__close { position: absolute; top: 1rem; inset-inline-end: 1.2rem; font-size: 2rem; line-height: 1; color: var(--pf-muted); font-family: sans-serif; }
.pf-modal__close:hover { color: var(--pf-accent); }
.pf-filmstrip { display: grid; grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; gap: .6rem; margin: 2rem 0; scroll-snap-type: x mandatory; }
.pf-film { min-height: 46vh; scroll-snap-align: start; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); }
.pf-film img { width: 100%; height: 46vh; object-fit: contain; background: var(--pf-bg-soft); opacity: 0; transition: opacity .7s; }
.pf-film img.is-loaded { opacity: 1; }
.pf-facts { display: grid; grid-template-columns: 9rem 1fr; gap: .6rem 1rem; margin-bottom: 2rem; }
.pf-facts dt { color: var(--pf-muted); }
.pf-story { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
.pf-story h3 { font-size: 1.4rem; margin-bottom: .5rem; }
.pf-story p { color: var(--pf-muted); }


/* ---------- الشعار وروابط التواصل ---------- */
.pf-logo { position: absolute; z-index: 3; top: 1.1rem; inset-inline-start: 4vw; }
.pf-logo:empty { display: none; }
.pf-logo img { display: block; height: 2.6rem; width: auto; max-width: 12rem; }
.pf-links { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem 2rem; margin-top: 1.8rem; }
.pf-links .pf-link { margin-top: 0; font-family: var(--pf-s); font-size: 1rem; }

@keyframes pf-rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes pf-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pf-shimmer { to { transform: translateX(100%); } }
@keyframes pf-scan { to { background-position: 0 40px; } }
@keyframes pf-flicker { 0%, 100% { opacity: 1; } 93% { opacity: .82; } 94% { opacity: 1; } 97% { opacity: .9; } }
@keyframes pf-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes pf-ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.3, 1.8); opacity: 0; } }

@media (max-width: 900px) {
  .pf-doors, .pf-grid, .pf-shop-grid, .pf-cv-cols, .pf-story, .pf-cv-row { grid-template-columns: 1fr; }
  .pf-door { border-inline-end: 0; border-bottom: 1px solid var(--pf-line); min-height: 22vh; }
  .pf-cv-cols { gap: 2.5rem; }
  .pf-cv-row { gap: .3rem; }
  .pf-modal__box { padding: 2rem 1.2rem; }
  .pf-filmstrip { grid-auto-columns: 92%; }
  .pf-langs { justify-content: center; }
  .pf-hero.has-logo .pf-langs { top: 4.6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .pf-reveal, .pf-words .w > span, .pf-door, .pf-card__slides img, .pf-service { transition: none !important; opacity: 1; transform: none; }
  .pf-hero::after, .pf-holo, .pf-pills li, .pf-cta::before, .pf-skel::after, .pf-hero__copy > * { animation: none !important; }
  .pf-bar::after { transform: scaleX(1); transition: none; }
}
</style>

<div id="pf-root" class="pf-wrap"></div>

<script>
(function () {
  "use strict";
  var root = document.getElementById("pf-root");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  /* اللغات الثماني: L(عربي, English, Français, Español, Русский, 中文, 日本語, 한국어)
     أي لغة ناقصة تعود تلقائيًا للإنجليزية. */
  function L(ar, en, fr, es, ru, zh, ja, ko) { return { ar: ar, en: en, fr: fr, es: es, ru: ru, zh: zh, ja: ja, ko: ko }; }

  /* ================================================================
     PF_DATA — كل محتوى الموقع هنا. الحقل النصي يمكن أن يكون:

      '<div><h3>' + esc(t("why")) + '</h3><p>' + esc(tx(p.why)) + '</p></div>' +
      '<div><h3>' + esc(t("notes")) + '</h3><p>' + esc(tx(p.notes)) + '</p></div></div></div>';
    bindImgs($modal);
    $modal.hidden = false; $modal.scrollTop = 0;
    document.documentElement.style.overflow = "hidden";
  }
  function closeModal() { $modal.hidden = true; $modal.innerHTML = ""; document.documentElement.style.overflow = ""; }

  /* ---------------- اللغة ---------------- */
  function applyLang(delay) {
    root.setAttribute("dir", isRtl() ? "rtl" : "ltr");
    root.setAttribute("lang", lang);
    loadFonts(lang);
    renderHero();
    showBody(delay);
  }

  /* ---------------- الأحداث ---------------- */
  root.addEventListener("click", function (e) {
    var langBtn = e.target.closest && e.target.closest("#pf-lang-btn");
    if (langBtn) {
      var lm = root.querySelector("#pf-lang-menu");
      if (lm) { lm.hidden = !lm.hidden; langBtn.setAttribute("aria-expanded", lm.hidden ? "false" : "true"); }
      return;
    }
    var el = e.target.closest("[data-lang],[data-door],[data-filter],[data-project],[data-close]");
    if (!el) { if (e.target === $modal) closeModal(); return; }
    if (el.hasAttribute("data-lang")) {
      lang = el.getAttribute("data-lang");
      try { localStorage.setItem("pf_lang", lang); } catch (x) {}
      applyLang(350);
    } else if (el.hasAttribute("data-door")) {
      setFilter(el.getAttribute("data-door"));
      var target = root.querySelector("#pf-projects");
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    } else if (el.hasAttribute("data-filter")) setFilter(el.getAttribute("data-filter"));
    else if (el.hasAttribute("data-project")) openProject(el.getAttribute("data-project"));
    else if (el.hasAttribute("data-close")) closeModal();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$modal.hidden) closeModal(); });
  document.addEventListener("click", function (e) {
    var lm = root.querySelector("#pf-lang-menu");
    if (lm && !lm.hidden && !e.target.closest("#pf-lang-menu") && !e.target.closest("#pf-lang-btn")) {
      lm.hidden = true;
      var lb = root.querySelector("#pf-lang-btn");
      if (lb) lb.setAttribute("aria-expanded", "false");
    }
  });

  // إمالة بطاقات الخدمات + توهج يتبع المؤشر + زر مغناطيسي
  root.addEventListener("pointermove", function (e) {
    if (reduceMotion || !e.target.closest) return;
    var c = e.target.closest(".pf-service");
    if (c) {
      var r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      c.style.setProperty("--rx", ((0.5 - py) * 8).toFixed(2) + "deg");
      c.style.setProperty("--ry", ((px - 0.5) * 10).toFixed(2) + "deg");
      c.style.setProperty("--gx", (px * 100).toFixed(1) + "%");
      c.style.setProperty("--gy", (py * 100).toFixed(1) + "%");
    }
    var m = e.target.closest(".pf-magnet");
    if (m) {
      var b = m.getBoundingClientRect();
      m.style.transform = "translate(" + ((e.clientX - b.left - b.width / 2) * 0.12).toFixed(1) + "px," + ((e.clientY - b.top - b.height / 2) * 0.25).toFixed(1) + "px)";
    }
  });
  root.addEventListener("pointerout", function (e) {
    if (!e.target.closest) return;
    var c = e.target.closest(".pf-service");
    if (c && !c.contains(e.relatedTarget)) { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); }
    var m = e.target.closest(".pf-magnet");
    if (m && !m.contains(e.relatedTarget)) m.style.transform = "";
  });

  /* ---------------- عرض تبادلي لصور المشروع (صورة كل ثانية عند التمرير) ---------------- */
  function startSlide(card) {
    if (reduceMotion) return;
    stopSlide(card);
    var imgs = card.querySelectorAll(".pf-card__slides img:not(.is-base)");
    if (!imgs.length) return;
    for (var k = 0; k < imgs.length; k++) imgs[k].classList.add("is-slide");
    card.classList.add("is-sliding");
    var idx = 0;
    var step = function () {
      if (idx >= imgs.length) { stopSlide(card); return; }  // انتهت الدورة → عودة الغلاف
      for (var k = 0; k < imgs.length; k++) imgs[k].classList.toggle("is-on", k === idx);
      idx++;
    };
    step();
    card.__slideTimer = setInterval(step, 2000);
  }
  function stopSlide(card) {
    if (card.__slideTimer) { clearInterval(card.__slideTimer); card.__slideTimer = null; }
    card.classList.remove("is-sliding");
    var imgs = card.querySelectorAll(".pf-card__slides img");
    for (var k = 0; k < imgs.length; k++) imgs[k].classList.remove("is-on");
  }
  root.addEventListener("pointerover", function (e) {
    if (reduceMotion || !e.target.closest) return;
    var card = e.target.closest(".pf-card");
    if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
    startSlide(card);
  });
  root.addEventListener("pointerout", function (e) {
    if (!e.target.closest) return;
    var card = e.target.closest(".pf-card");
    if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
    stopSlide(card);
  });
  root.addEventListener("focusin", function (e) {
    var card = e.target.closest && e.target.closest(".pf-card");
    if (card) startSlide(card);
  });
  root.addEventListener("focusout", function (e) {
    var card = e.target.closest && e.target.closest(".pf-card");
    if (card) stopSlide(card);
  });

  /* ---------------- و أخيرا التشغيل ---------------- */
  Holo.add("hero", root.querySelector("#pf-hero-canvas"), { shape: "knot", side: "end", k: 0.09, fy: 0.42, alpha: 0.42, spinX: 0.003, spinY: 0.004, mouse: 1, rx0: 0.4, ry0: 0.2 });
  applyLang(750);
})();
</script>
